name: Cleanup Old AQI Files

on:
  schedule:
    - cron: '0 0,12 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-old-files:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Colombo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clean up files beyond 2-week retention
        run: |
          for folder in charts all_stations_maps; do
            safe_limit=600      # When to trigger deletion
            keep_recent=300     # Keep the newest 2 weeks' files

            file_count=$(find "$folder" -type f | wc -l)
            if [ "$file_count" -gt "$safe_limit" ]; then
              delete_count=$((file_count - keep_recent))
              echo "File count in $folder is $file_count. Deleting $delete_count oldest files..."

              find "$folder" -type f -printf '%T@ %p\n' | sort -n | head -n "$delete_count" | cut -d' ' -f2- | xargs -d '\n' rm -f
            else
              echo "File count in $folder is $file_count, no cleanup needed."
            fi
          done

      - name: Commit and push cleanup changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "OrgBot"
          git config --global user.email "noreply@github.com"
          git add charts/* all_stations_maps/*
          git diff --cached --quiet || git commit -m "Cleanup: remove old AQI files"
          git pull --rebase
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
