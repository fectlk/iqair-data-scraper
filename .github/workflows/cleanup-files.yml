name: Cleanup Old Files

on:
  schedule:
    - cron: '0 1 * * *'  # Runs daily at 01:00 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-old-files:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Colombo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup old AQI files
        run: |
          for folder in charts all_stations_maps; do
            safe_limit=600      # Start deleting after 600 files
            keep_recent=300     # Keep this many newest files

            file_count=$(find "$folder" -type f | wc -l)
            echo "File count in $folder is $file_count."

            if [ "$file_count" -gt "$safe_limit" ]; then
              delete_count=$((file_count - keep_recent))
              echo "Deleting $delete_count oldest files from $folder..."

              find "$folder" -type f -printf '%T@ %p\n' | sort -n | head -n "$delete_count" | cut -d' ' -f2- | while read -r file; do
                rm -f "$file"
              done
            else
              echo "No cleanup needed in $folder."
            fi
          done

      - name: Commit and push cleanup changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "OrgBot"
          git config --global user.email "noreply@github.com"
          git add charts/* all_stations_maps/*
          git diff --cached --quiet || git commit -m "Cleanup: remove old AQI files"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
